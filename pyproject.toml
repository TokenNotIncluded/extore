[project]
name = "extore"
version = "0.4.0"
description = "Single-merchant redemption and fulfillment with product queues, Passkeys, and native WebMCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[project.urls]
Homepage = "https://extore.lmm.best"
Repository = "https://github.com/TokenNotIncluded/extore"
Documentation = "https://github.com/TokenNotIncluded/extore/tree/main/docs"
Issues = "https://github.com/TokenNotIncluded/extore/issues"
Funding = "https://donate.lmm.best/?project=extore"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [".", "processors/official"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extore", "processors/official/extore_processors"]

[tool.hatch.build.targets.wheel.force-include]
"processors/official/LICENSE" = "extore_processors/LICENSE"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
