server {
    listen 80;
    listen [::]:80;
    server_name extore.lmm.best;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/extore-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name extore.lmm.best;
    ssl_certificate /etc/letsencrypt/live/extore.lmm.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/extore.lmm.best/privkey.pem;
    client_max_body_size 256k;
    # No card tokens or customer parameters in access logs.
    access_log /var/log/nginx/extore.access.log msg_safe;
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
