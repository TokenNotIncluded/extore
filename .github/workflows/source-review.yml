name: Source review snapshot
on:
  push:
    branches: [fix/open-layout-direct-delete-20261009]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.12.20"
      - run: uv sync --frozen --python 3.13
      - name: Export locked test dependencies without source or credentials
        run: tar -C .venv/lib/python3.13/site-packages -czf "$RUNNER_TEMP/extore-test-dependencies.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: extore-test-dependencies
          path: ${{ runner.temp }}/extore-test-dependencies.tar.gz
          retention-days: 1
