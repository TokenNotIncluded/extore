name: Source review tools
on:
  push:
    branches: [fix/open-layout-direct-delete-20261009]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.12.20"
      - run: uv sync --frozen --python 3.13
      - uses: actions/upload-artifact@v4
        with:
          name: extore-formatter
          path: .venv/bin/ruff
          retention-days: 1
