name: UI regression review
on:
  push:
    branches: [fix/mobile-admin-passkey-appearance]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Save the exact source used for isolated review
        run: |
          mkdir -p /tmp/ui-review
          git archive HEAD | gzip > /tmp/ui-review/source.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-review-source
          path: /tmp/ui-review/source.tar.gz
          retention-days: 3
      - name: JavaScript baseline
        run: node --test tests/*.test.cjs > /tmp/ui-review/javascript.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ui-review-results
          path: /tmp/ui-review/javascript.log
          retention-days: 3
