name: UI regression review
on:
  push:
    branches: [fix/mobile-admin-passkey-appearance]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.12.20"
      - name: Prepare isolated dependency set
        run: |
          mkdir -p /tmp/ui-review/wheels
          uv sync --frozen --python 3.12
          uv export --frozen --no-emit-project --no-hashes > /tmp/ui-review/requirements.txt
          python3 -m pip download --python-version 311 --only-binary=:all: -r /tmp/ui-review/requirements.txt -d /tmp/ui-review/wheels
          tar -czf /tmp/ui-review/official-processors.tar.gz processors/official/extore_processors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-review-dependencies
          path: /tmp/ui-review
          retention-days: 3
      - name: Authentication and JavaScript baseline
        run: |
          node --test tests/*.test.cjs > /tmp/ui-review/javascript.log 2>&1
          uv run pytest -q tests/test_passkeys.py > /tmp/ui-review/python.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ui-review-baseline
          path: /tmp/ui-review/*.log
          retention-days: 3
