name: CI
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.20"
      - name: Install processor sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libcap-dev libseccomp2 libssl-dev
          git init "$RUNNER_TEMP/extore-bubblewrap"
          git -C "$RUNNER_TEMP/extore-bubblewrap" remote add origin https://github.com/containers/bubblewrap.git
          git -C "$RUNNER_TEMP/extore-bubblewrap" fetch --depth=1 origin 719a4fd474d44b26906bcf2b1b0fb6eddd8d56d0
          git -C "$RUNNER_TEMP/extore-bubblewrap" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/extore-bubblewrap-build" "$RUNNER_TEMP/extore-bubblewrap" --prefix=/usr -Dtests=false -Dman=disabled -Dselinux=disabled
          meson compile -C "$RUNNER_TEMP/extore-bubblewrap-build"
          sudo meson install -C "$RUNNER_TEMP/extore-bubblewrap-build"
          /usr/bin/bwrap --version
      - run: uv sync --frozen --python 3.12
      - name: Build and test the native service
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked
          cargo +stable build --locked
      - run: uv run ruff check extore scripts tests examples
      - run: uv run ruff format --check extore scripts tests examples
      - run: uv run ruff check --config pyproject.toml processors/official/extore_processors processors/official/tests
      - run: uv run ruff format --check --config pyproject.toml processors/official/extore_processors processors/official/tests
      - run: uv run pytest -q
      - name: Verify native HTTP and worker contracts
        run: EXTORE_PROCESSOR_PYTHON="$PWD/.venv/bin/python" uv run python scripts/check_native_contracts.py
      - run: uv run python -m compileall -q extore scripts examples
      - run: uv run python examples/workflows/validate_examples.py
      - name: Check all shipped JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extore/static -type f -name '*.js' -print0)
      - run: node --test tests/*.test.cjs
      - run: uv run pytest -q processors/official/tests
      - run: uv build -q
      - run: uv run extore --help
      - run: uv run extore --version
      - run: uv run extore workflow --help
      - run: uv run extore processors --help
      - run: uv run extore processors contribute --language en --output "$RUNNER_TEMP/extore-contribution.json"
      - run: uv run extore workflow validate --definition examples/workflows/file-transform/flow.json --product examples/workflows/file-transform/product.json
      - run: uv run extore manage --help
      - run: uv run extore admin --help
      - run: uv run extore admin board --help
      - run: uv run extore manage board --help
      - run: uv run extore customer --help
      - run: uv run extore commerce --help
      - run: uv run extore admin commerce --help
      - run: uv run python examples/commerce_import/mock_roundtrip.py
      - name: Record the tested native service for review
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tarfile

          root = Path.cwd()
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if revision != os.environ["GITHUB_SHA"]:
              raise SystemExit("review checkout does not match the workflow commit")
          subprocess.run(["git", "diff", "--exit-code"], check=True)
          binary = root / "target/debug/extore"
          destination = Path(os.environ["RUNNER_TEMP"]) / "extore-native-review"
          destination.mkdir()
          shutil.copy2(binary, destination / "extore")
          def sha256(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          names = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "Cargo.toml", "Cargo.lock", "src"],
          ).decode().split("\0")
          inputs = [
              {"path": name, "sha256": sha256(root / name), "bytes": (root / name).stat().st_size}
              for name in sorted(names) if name
          ]
          manifest = {
              "schema_version": 1,
              "kind": "extore-native-service-review",
              "source_revision": revision,
              "rustc": subprocess.check_output(["rustc", "+stable", "-Vv"], text=True),
              "build_command": ["cargo", "+stable", "build", "--locked"],
              "binary": {"path": "extore", "sha256": sha256(destination / "extore"),
                         "bytes": (destination / "extore").stat().st_size},
              "source_files": inputs,
              "scope": "review service binary after existing CI and native HTTP/worker checks; not a deployment",
          }
          (destination / "MANIFEST.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n"
          )
          archive = destination.with_suffix(".tar.gz")
          with tarfile.open(archive, "w:gz") as output:
              output.add(destination / "extore", arcname="extore")
              output.add(destination / "MANIFEST.json", arcname="MANIFEST.json")
          archive.with_suffix(archive.suffix + ".sha256").write_text(
              sha256(archive) + "  " + archive.name + "\n"
          )
          PY
      - name: Upload the review service binary
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extore-native-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/extore-native-review.tar.gz
            ${{ runner.temp }}/extore-native-review.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
