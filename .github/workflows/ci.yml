name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.20"
      - name: Install processor sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libcap-dev libseccomp2
          git init "$RUNNER_TEMP/extore-bubblewrap"
          git -C "$RUNNER_TEMP/extore-bubblewrap" remote add origin https://github.com/containers/bubblewrap.git
          git -C "$RUNNER_TEMP/extore-bubblewrap" fetch --depth=1 origin 719a4fd474d44b26906bcf2b1b0fb6eddd8d56d0
          git -C "$RUNNER_TEMP/extore-bubblewrap" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/extore-bubblewrap-build" "$RUNNER_TEMP/extore-bubblewrap" --prefix=/usr -Dtests=false -Dman=disabled -Dselinux=disabled
          meson compile -C "$RUNNER_TEMP/extore-bubblewrap-build"
          sudo meson install -C "$RUNNER_TEMP/extore-bubblewrap-build"
          /usr/bin/bwrap --version
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check extore scripts tests
      - run: uv run ruff format --check extore scripts tests
      - run: uv run ruff check --config pyproject.toml processors/official/extore_processors processors/official/tests
      - run: uv run ruff format --check --config pyproject.toml processors/official/extore_processors processors/official/tests
      - run: uv run pytest -q
      - run: uv run python -m compileall -q extore scripts
      - run: node --check extore/static/account.js
      - run: node --check extore/static/vendor/qrcodegen.js
      - run: node --check extore/static/totp-qr.js
      - run: node --check extore/static/device-login.js
      - run: node --check extore/static/pipeline-authorizations.js
      - run: |
          for file in extore/static/{task-flow,task-flow-editor,text-cards,batch-redemption,proxy-routing,proxy-config}.js; do node --check "$file"; done
      - run: node --check extore/static/app.js
      - run: node --check extore/static/progress-board.js
      - run: node --check extore/static/worker-identity.js
      - run: node --check extore/static/preferences.js
      - run: node --check extore/static/products.js
      - run: node --check extore/static/cards.js
      - run: node --check extore/static/webmcp.js
      - run: node --check extore/static/product-export.js
      - run: node --check extore/static/customer-motion.js
      - run: node --check extore/static/source-link.js
      - run: node --check extore/static/cli-prompts.js
      - run: node --check extore/static/owner-cli.js
      - run: node --test tests/*.test.cjs
      - run: uv run pytest -q processors/official/tests
      - run: uv build -q
      - run: uv run extore --help
      - run: uv run extore --version
      - run: uv run extore manage --help
      - run: uv run extore admin --help
      - run: uv run extore admin board --help
      - run: uv run extore manage board --help
      - run: uv run extore customer --help
