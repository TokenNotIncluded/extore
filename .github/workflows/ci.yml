name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.20"
      - name: Install processor sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libcap-dev libseccomp2
          git init "$RUNNER_TEMP/extore-bubblewrap"
          git -C "$RUNNER_TEMP/extore-bubblewrap" remote add origin https://github.com/containers/bubblewrap.git
          git -C "$RUNNER_TEMP/extore-bubblewrap" fetch --depth=1 origin 719a4fd474d44b26906bcf2b1b0fb6eddd8d56d0
          git -C "$RUNNER_TEMP/extore-bubblewrap" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/extore-bubblewrap-build" "$RUNNER_TEMP/extore-bubblewrap" --prefix=/usr -Dtests=false -Dman=disabled -Dselinux=disabled
          meson compile -C "$RUNNER_TEMP/extore-bubblewrap-build"
          sudo meson install -C "$RUNNER_TEMP/extore-bubblewrap-build"
          /usr/bin/bwrap --version
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check extore scripts tests examples
      - run: uv run ruff format --check extore scripts tests examples
      - run: uv run ruff check --config pyproject.toml processors/official/extore_processors processors/official/tests
      - run: uv run ruff format --check --config pyproject.toml processors/official/extore_processors processors/official/tests
      - run: uv run pytest -q
      - run: uv run python -m compileall -q extore scripts examples
      - run: uv run python examples/workflows/validate_examples.py
      - name: Check all shipped JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extore/static -type f -name '*.js' -print0)
      - run: node --test tests/*.test.cjs
      - run: uv run pytest -q processors/official/tests
      - run: uv build -q
      - run: uv run extore --help
      - run: uv run extore --version
      - run: uv run extore workflow --help
      - run: uv run extore processors --help
      - run: uv run extore processors contribute --language en --output "$RUNNER_TEMP/extore-contribution.json"
      - run: uv run extore workflow validate --definition examples/workflows/file-transform/flow.json --product examples/workflows/file-transform/product.json
      - run: uv run extore manage --help
      - run: uv run extore admin --help
      - run: uv run extore admin board --help
      - run: uv run extore manage board --help
      - run: uv run extore customer --help
      - run: uv run extore commerce --help
      - run: uv run extore admin commerce --help
      - run: uv run python examples/commerce_import/mock_roundtrip.py
