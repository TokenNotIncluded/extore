[workspace]
resolver = "2"
members = ["api", "plugin", "host"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/TokenNotIncluded/extore"

[workspace.dependencies]
zplugin = { version = "=0.3.1", default-features = false, features = ["alloc", "macros"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
