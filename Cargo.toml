[package]
name = "extore"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Multi-shop redemption, fulfillment and LMM marketplace integration"
repository = "https://github.com/TokenNotIncluded/extore"

[features]
plugin = ["dep:extore-plugin-api"]

[dependencies]
extore-plugin-api = { path = "crates/extore-plugin-api", optional = true }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
url = "2"
argon2 = "0.5"
fernet = "0.2"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
webauthn-rs-core = "0.5.5"
ciborium = "0.2"
serde_cbor_2 = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
data-encoding = "2"
sha1 = "0.10"

aes-gcm = "0.10"
hkdf = "0.12"

lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }

multer = "3"
futures-util = "0.3"
fs2 = "0.4"

libc = "0.2"

unicode-general-category = "1.1"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = ["crates/extore-plugin-api", "crates/extore-zplugin"]
default-members = ["."]
resolver = "2"
