services:
  # First use: create ./data owned by UID/GID 10001 before starting Compose.
  # Init validates an existing store and performs only supported migrations.
  init:
    build: .
    image: extore:local
    command: ["init"]
    restart: "no"
    environment: &env
      EXTORE_ORIGIN: ${EXTORE_ORIGIN:-http://localhost:8000}
      EXTORE_DATA: /data
      EXTORE_STATIC: /app/extore/static
      EXTORE_LISTEN: 0.0.0.0:8000
    volumes: &volumes
      - ./data:/data
  api:
    build: .
    image: extore:local
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment: *env
    volumes: *volumes
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-I",
          "-S",
          "-B",
          "-c",
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5))['runtime'] == 'rust'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
  worker:
    build: .
    image: extore:local
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment: *env
    volumes: *volumes
    stop_grace_period: 150s
